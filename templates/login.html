<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mosquito Guard Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <div class="logo-icon">🦟</div>
      <h1 class="title">Mosquito Guard</h1>
      <p class="subtitle">Enter your credentials to access the dashboard</p>
    </div>

    <div class="error-msg{% if not error %} is-hidden{% endif %}" role="alert">
      {{ error }}
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username / Admin ID</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="e.g. admin" required autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Sign In to Dashboard</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
