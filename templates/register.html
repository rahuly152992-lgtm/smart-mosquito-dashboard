<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Mosquito Guard Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <div class="logo-icon">🦟</div>
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Register to access the dashboard</p>
    </div>

    <div class="error-msg{% if not error %} is-hidden{% endif %}" role="alert">{{ error }}</div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username / Admin ID</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password">
      </div>
      <button type="submit" class="login-btn">Create Account</button>
    </form>
  </div>
</body>
</html>
