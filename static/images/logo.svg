<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="dangerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M100 12 C148 12 178 35 178 78 C178 132 128 172 100 188 C72 172 22 132 22 78 C22 35 52 12 100 12 Z" 
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Inner Water Ripple Lines -->
  <path d="M45 105 C75 92 125 92 155 105" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 125 C80 115 120 115 145 125" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/>

  <!-- Water Drop Outline -->
  <path d="M100 38 C100 38 140 85 140 116 C140 138 122 156 100 156 C78 156 60 138 60 116 C60 85 100 38 100 38 Z" 
        fill="url(#dropGrad)" opacity="0.35" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Stylized Mosquito Emblem with Crosshair / Warning Target -->
  <!-- Target Crosshair -->
  <circle cx="100" cy="112" r="32" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85"/>
  <line x1="100" y1="74" x2="100" y2="82" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="142" x2="100" y2="150" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="112" x2="70" y2="112" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="112" x2="138" y2="112" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Mosquito Silhouette -->
  <!-- Thorax & Abdomen -->
  <ellipse cx="100" cy="114" rx="4.5" ry="14" fill="#ffffff" />
  <ellipse cx="100" cy="95" rx="5.5" ry="5.5" fill="#f8fafc" />
  <ellipse cx="100" cy="86" rx="3.5" ry="3.5" fill="#f8fafc" />
  
  <!-- Proboscis (Needle) -->
  <line x1="100" y1="83" x2="100" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Antennae -->
  <path d="M98 84 Q90 76 86 78" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M102 84 Q110 76 114 78" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wings -->
  <path d="M101 94 Q135 68 142 85 Q130 102 103 98" fill="rgba(255,255,255,0.75)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M99 94 Q65 68 58 85 Q70 102 97 98" fill="rgba(255,255,255,0.75)" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Legs -->
  <!-- Front legs -->
  <path d="M96 92 L76 86 L66 94" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M104 92 L124 86 L134 94" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Middle legs -->
  <path d="M96 98 L70 105 L62 120" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M104 98 L130 105 L138 120" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Hind legs -->
  <path d="M97 110 L72 128 L64 150" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M103 110 L128 128 L136 150" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Water Pulse Ping Indicator -->
  <circle cx="100" cy="112" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
</svg>
