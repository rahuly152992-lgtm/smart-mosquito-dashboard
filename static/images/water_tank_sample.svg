<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tankBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="8" fill="url(#tankBg)"/>
  
  <!-- Drainage Pit / Water Tank Structure -->
  <rect x="50" y="40" width="300" height="160" rx="8" fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Water Fill Level (58%) -->
  <rect x="54" y="105" width="292" height="92" rx="4" fill="url(#tankWater)" opacity="0.85"/>
  <path d="M 54 105 Q 127 98 200 105 T 346 105" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>

  <!-- Caution Marker Overlay -->
  <rect x="70" y="55" width="150" height="28" rx="4" fill="#f59e0b"/>
  <text x="80" y="73" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">🟡 CAUTION LEVEL: 58%</text>

  <!-- Drainage Pipe and Valve -->
  <rect x="330" y="160" width="40" height="20" rx="2" fill="#94a3b8"/>
  <circle cx="350" cy="150" r="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  
  <!-- Sensor Probes Submerged -->
  <line x1="120" y1="20" x2="120" y2="150" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="150" r="5" fill="#f59e0b"/>
  <line x1="160" y1="20" x2="160" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="90" r="5" fill="#0284c7"/>

  <text x="60" y="222" font-family="sans-serif" font-size="11" fill="#94a3b8">Sector 2 - Rain Harvesting Sump (Sensor Active)</text>
</svg>
