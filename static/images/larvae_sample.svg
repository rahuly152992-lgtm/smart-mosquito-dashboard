<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#0e3b5e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Water Container Camera Feed Background -->
  <rect width="400" height="240" rx="8" fill="url(#waterBg)"/>
  <rect width="400" height="240" fill="url(#grid)"/>

  <!-- Water Surface Ripples -->
  <path d="M 0 60 Q 100 45 200 60 T 400 60" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  <path d="M 0 68 Q 120 55 240 68 T 400 68" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Submerged Particulates & Larvae Silhouette 1 -->
  <!-- Larva 1 -->
  <g transform="translate(130, 110) rotate(-25)">
    <path d="M0 0 Q15 -8 28 0 Q38 12 45 4" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="48" cy="4" r="5" fill="#f8fafc"/>
    <circle cx="50" cy="3" r="1.5" fill="#0f172a"/>
    <line x1="2" y1="-2" x2="-8" y2="-6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Larva 2 (Pupae / Tumbler) -->
  <g transform="translate(240, 140) rotate(40)">
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#cbd5e1"/>
    <path d="M-6 0 Q-15 10 -22 6" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Larva 3 -->
  <g transform="translate(80, 165) rotate(15)">
    <path d="M0 0 Q12 -6 22 2 Q30 10 38 4" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="40" cy="4" r="4" fill="#cbd5e1"/>
  </g>

  <!-- AI Computer Vision Bounding Box 1 (High Risk Hotspot) -->
  <rect x="110" y="85" width="85" height="65" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
  <rect x="110" y="65" width="85" height="20" rx="3" fill="#ef4444"/>
  <text x="115" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Larvae (94%)</text>

  <!-- AI Computer Vision Bounding Box 2 -->
  <rect x="215" y="115" width="75" height="60" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
  <rect x="215" y="95" width="75" height="20" rx="3" fill="#ef4444"/>
  <text x="220" y="109" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Pupa (86%)</text>

  <!-- Camera HUD Overlay -->
  <rect x="10" y="10" width="130" height="26" rx="13" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="23" cy="23" r="4" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">ESP32-CAM LIVE</text>

  <rect x="270" y="10" width="120" height="26" rx="6" fill="rgba(239, 68, 68, 0.9)"/>
  <text x="278" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">⚠️ AI RISK: 88%</text>

  <text x="12" y="228" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">RES: 1600x1200 | FPS: 15 | SENSOR: OV2640</text>
</svg>
